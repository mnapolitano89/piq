name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Shell-hook tests run against every shell present; make sure all three are.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install fish
      - name: Show shell versions
        run: |
          bash --version | head -1
          zsh --version
          fish --version
      - run: npm test
      - name: Verify local installer
        run: |
          TMP_ROOT="$(mktemp -d)"
          PIQ_INSTALL_DIR="$TMP_ROOT/share" PIQ_BIN_DIR="$TMP_ROOT/bin" sh ./install.sh --local
          "$TMP_ROOT/bin/piq" --version
          "$TMP_ROOT/bin/piq" --init zsh >/dev/null
          "$TMP_ROOT/bin/piq" --init bash >/dev/null
          "$TMP_ROOT/bin/piq" --init fish >/dev/null
